<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="title" content="ROYAL123 - Link Resmi Login & Daftar Akun">
  <meta name="description" content="Akses cepat link resmi login dan pendaftaran akun ROYAL123. Tautan aman, cepat, dan terverifikasi.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://your-landing-domain.example.com/">

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ROYAL123 - Link Resmi Login & Daftar Akun">
  <meta property="og:description" content="Portal link redirect resmi untuk login dan pendaftaran akun baru ROYAL123.">

  <link rel="apple-touch-icon" href="assets/logo-r.png">

  <!-- Google Font: Plus Jakarta Sans for Crisp Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- CSS Stylesheet (Purple Running Light Theme) -->
  <link rel="stylesheet" href="style.css">

  <!-- Scripts (Deferred) -->
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Main Centered Redirect Wrapper -->
  <div class="gateway-container">
    
    <!-- Top Header: Logo & Greeting -->
    <header class="gateway-header">
      <div class="logo-box">
        <img src="assets/logo.png" alt="ROYAL123" class="brand-logo" id="brandLogo" width="180" height="75">
      </div>
      <p class="welcome-text" data-bind="welcomeText">SELAMAT DATANG DI</p>

    <!-- Main Card: Promo Flyer Banner & Action Buttons -->
    <main class="gateway-main">

      <div class="banner-card">
        <img src="assets/banner.png" alt="ROYAL123 Promo Banner" class="promo-banner" id="promoBanner" width="310" height="310" fetchpriority="high">
      </div>

      <!-- Action Buttons (Login & Daftar) with Fallback Hrefs & Running Light Purple -->
      <div class="action-buttons">
        <!-- LOGIN Button (Target: Official Login URL) -->
        <a href="https://linkjp.lol/royal123" data-target="login" target="_blank" rel="noopener noreferrer" class="btn-action btn-login">
          LOGIN

          DAFTAR

      </div>
    </main>

    <!-- Footer Copyright -->
    <footer class="gateway-footer">
      <p class="copyright-text">
        &copy; Copyright <span id="currentYear">2026</span> <strong data-bind="brandName">ROYAL123</strong> - <span data-bind="footerCredit">SEO NGUYENSU</span>

</body>
</html>
